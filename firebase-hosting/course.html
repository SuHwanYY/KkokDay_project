<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>콕데이 코스</title>

    <!-- 코스 문서(courses/{courseId})는 firestore.rules에서 read를 누구나 허용해뒀다 —
         앱 미설치 사용자도 이 페이지에서 로그인 없이 볼 수 있다. -->
    <script defer src="/__/firebase/12.18.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.18.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>

    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #FFFBF0;
        color: #333333;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      }
      .wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 20px 48px;
      }
      .brand {
        font-size: 13px;
        font-weight: 700;
        color: #FFC83D;
        letter-spacing: 0.02em;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .description {
        color: #666666;
        font-size: 14px;
        margin: 0 0 20px;
        white-space: pre-wrap;
      }
      .count {
        font-size: 13px;
        color: #9E9E9E;
        margin-bottom: 12px;
      }
      #places {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .place-card {
        display: flex;
        gap: 12px;
        background: #FFFFFF;
        border: 1px solid #ECECEC;
        border-radius: 14px;
        padding: 14px;
      }
      .place-order {
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #FFC83D;
        color: #333333;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .place-body { min-width: 0; }
      .place-name {
        font-weight: 700;
        font-size: 15px;
        margin: 0 0 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .place-address {
        font-size: 13px;
        color: #9E9E9E;
        margin: 0 0 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .place-category {
        font-size: 12px;
        color: #4DB6AC;
        margin: 0;
      }
      .state {
        text-align: center;
        color: #9E9E9E;
        padding: 60px 20px;
        font-size: 14px;
      }
      /* 동행자와 투표해서 정하기 — 보기 전용 정적 페이지에 이 영역만 인터랙티브하다. */
      #extra { margin-top: 24px; }
      .vote-card {
        background: #FFFFFF;
        border: 1px solid #ECECEC;
        border-radius: 14px;
        padding: 16px;
      }
      .vote-title {
        font-weight: 700;
        font-size: 16px;
        margin-bottom: 4px;
      }
      .vote-total {
        font-size: 13px;
        color: #9E9E9E;
        margin-bottom: 12px;
      }
      .vote-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid #ECECEC;
        border-radius: 10px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .vote-option-selected {
        border-color: #FFC83D;
        background: rgba(255, 200, 61, 0.08);
      }
      .vote-option {
        flex-direction: column;
        align-items: stretch;
        cursor: default;
      }
      .vote-option-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .vote-option input[type="checkbox"] {
        accent-color: #FFC83D;
        flex: none;
        width: 18px;
        height: 18px;
        cursor: pointer;
      }
      .vote-option-body {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .vote-option-name {
        font-weight: 700;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .vote-option-count {
        flex: none;
        font-size: 12px;
        font-weight: 700;
        color: #333333;
        background: rgba(255, 200, 61, 0.25);
        padding: 2px 8px;
        border-radius: 8px;
        cursor: pointer;
      }
      .vote-option-voters {
        display: none;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed #ECECEC;
        font-size: 12px;
        color: #666666;
        line-height: 1.6;
      }
      .vote-option-voters.vote-option-voters-open { display: block; }
      .vote-option-voters-empty { color: #9E9E9E; }
      .vote-name-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ECECEC;
        border-radius: 10px;
        font-size: 14px;
        margin: 12px 0 8px;
        font-family: inherit;
      }
      .vote-submit-btn {
        width: 100%;
        padding: 12px;
        background: #FFC83D;
        color: #333333;
        font-weight: 700;
        font-size: 15px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      .vote-submit-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .vote-message {
        min-height: 18px;
        font-size: 13px;
        color: #4DB6AC;
        margin-top: 8px;
        text-align: center;
      }
      .vote-message-error { color: #FF6B6B; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">콕데이</div>
      <div id="content">
        <div class="state">불러오는 중...</div>
      </div>
      <div id="extra"></div>
    </div>

    <script>
      function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value == null ? '' : String(value);
        return div.innerHTML;
      }

      // 앱(CourseVoteRepositoryImpl.kt)과 반드시 같은 규칙을 써야 한다 — 다르면 같은
      // 이름인데 앱/웹에서 다른 문서로 갈라져 "같은 이름 덮어쓰기"가 깨진다.
      var MAX_VOTER_NAME_LENGTH = 40;

      function sanitizeVoterId(rawName) {
        return String(rawName == null ? '' : rawName).trim().replace(/\//g, '_').slice(0, MAX_VOTER_NAME_LENGTH);
      }

      function isValidVoterId(voterId) {
        return voterId.length > 0 && voterId !== '.' && voterId !== '..';
      }

      // 앱의 CoursePlace.voteCandidateId()와 동일한 규칙(kakao place id 우선, 없으면
      // 좌표 조합) — 코스 안 장소 순서가 바뀌어도 투표가 엉뚱한 장소를 가리키지 않는다.
      function candidateIdFor(place) {
        if (place && place.kakaoPlaceId) return String(place.kakaoPlaceId);
        return String(place.latitude) + '_' + String(place.longitude);
      }

      function initVoteUi(courseId, course) {
        var places = course.places || [];
        var extra = document.getElementById('extra');
        if (places.length === 0) {
          extra.innerHTML = '';
          return;
        }

        var optionsHtml = places
          .map(function (place) {
            var id = candidateIdFor(place);
            return (
              '<div class="vote-option" data-candidate-id="' + escapeHtml(id) + '">' +
              '<label class="vote-option-row">' +
              '<input type="checkbox" data-candidate-checkbox value="' + escapeHtml(id) + '" />' +
              '<span class="vote-option-body">' +
              '<span class="vote-option-name">' + escapeHtml(place.placeName) + '</span>' +
              '<span class="vote-option-count" data-count-for="' + escapeHtml(id) + '">0표</span>' +
              '</span>' +
              '</label>' +
              '<div class="vote-option-voters" data-voters-for="' + escapeHtml(id) + '"></div>' +
              '</div>'
            );
          })
          .join('');

        extra.innerHTML =
          '<div class="vote-card">' +
          '<div class="vote-title">동행자와 투표해서 정하기</div>' +
          '<div class="vote-total" id="vote-total">아직 투표가 없어요</div>' +
          '<div id="vote-options">' + optionsHtml + '</div>' +
          '<input id="vote-name" class="vote-name-input" type="text" placeholder="이름을 입력해주세요" maxlength="' +
          MAX_VOTER_NAME_LENGTH + '" />' +
          '<button id="vote-submit" class="vote-submit-btn" type="button">투표하기</button>' +
          '<div id="vote-message" class="vote-message"></div>' +
          '</div>';

        var votesRef = firebase.firestore().collection('courses').doc(courseId).collection('votes');
        // 여러 후보를 동시에 선택하는 중복 투표를 허용한다 — 앱의 candidateIds(배열)와 같은 구조.
        var selectedCandidateIds = {};
        var isSubmitting = false;
        var appliedInitialSelection = false;

        var submitBtn = document.getElementById('vote-submit');
        var nameInput = document.getElementById('vote-name');
        var messageEl = document.getElementById('vote-message');
        var totalEl = document.getElementById('vote-total');

        function setMessage(text, isError) {
          messageEl.textContent = text || '';
          messageEl.className = 'vote-message' + (isError ? ' vote-message-error' : '');
        }

        function updateOptionSelectionUI() {
          var options = document.querySelectorAll('.vote-option');
          for (var i = 0; i < options.length; i++) {
            var option = options[i];
            var id = option.getAttribute('data-candidate-id');
            var isSelected = !!selectedCandidateIds[id];
            option.classList.toggle('vote-option-selected', isSelected);
            option.querySelector('input[type="checkbox"]').checked = isSelected;
          }
        }

        document.getElementById('vote-options').addEventListener('change', function (event) {
          if (event.target && event.target.hasAttribute('data-candidate-checkbox')) {
            var id = event.target.value;
            if (event.target.checked) {
              selectedCandidateIds[id] = true;
            } else {
              delete selectedCandidateIds[id];
            }
            updateOptionSelectionUI();
          }
        });

        // 득표 배지를 탭하면 그 후보에 투표한 사람 이름을 펼쳐서 보여준다(다시 탭하면 접힘).
        document.getElementById('vote-options').addEventListener('click', function (event) {
          var countEl = event.target.closest('.vote-option-count');
          if (!countEl) return;
          var id = countEl.getAttribute('data-count-for');
          var panel = document.querySelector('[data-voters-for="' + id + '"]');
          if (panel) panel.classList.toggle('vote-option-voters-open');
        });

        submitBtn.addEventListener('click', function () {
          if (isSubmitting) return;
          var voterId = sanitizeVoterId(nameInput.value);
          if (!isValidVoterId(voterId)) {
            setMessage('올바른 이름을 입력해주세요.', true);
            return;
          }

          isSubmitting = true;
          submitBtn.disabled = true;
          submitBtn.textContent = '투표하는 중...';
          setMessage('');

          votesRef
            .doc(voterId)
            .set({
              voterName: voterId,
              candidateIds: Object.keys(selectedCandidateIds),
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            })
            .then(function () {
              setMessage('투표했어요!', false);
            })
            .catch(function (error) {
              console.error(error);
              setMessage('투표에 실패했어요. 다시 시도해주세요.', true);
            })
            .finally(function () {
              isSubmitting = false;
              submitBtn.disabled = false;
              submitBtn.textContent = '투표하기';
            });
        });

        // 실시간 구독 — 투표 중인 사람이든 구경만 하는 사람이든 득표 수/투표자 명단이 즉시 갱신된다.
        votesRef.onSnapshot(
          function (snapshot) {
            var counts = {};
            var namesByCandidate = {};
            var votes = [];
            snapshot.forEach(function (doc) {
              var data = doc.data();
              votes.push(data);
              (data.candidateIds || []).forEach(function (id) {
                counts[id] = (counts[id] || 0) + 1;
                if (!namesByCandidate[id]) namesByCandidate[id] = [];
                namesByCandidate[id].push(data.voterName);
              });
            });
            places.forEach(function (place) {
              var id = candidateIdFor(place);
              var countEl = document.querySelector('[data-count-for="' + id + '"]');
              if (countEl) countEl.textContent = (counts[id] || 0) + '표';

              var panel = document.querySelector('[data-voters-for="' + id + '"]');
              if (panel) {
                var names = namesByCandidate[id] || [];
                panel.innerHTML = names.length > 0
                  ? names.map(escapeHtml).join(', ')
                  : '<span class="vote-option-voters-empty">아직 투표한 사람이 없어요</span>';
              }
            });

            totalEl.textContent = votes.length > 0 ? votes.length + '명 참여' : '아직 투표한 사람이 없어요';

            if (!appliedInitialSelection) {
              var currentName = sanitizeVoterId(nameInput.value);
              var existing = null;
              for (var i = 0; i < votes.length; i++) {
                if (votes[i].voterName === currentName) {
                  existing = votes[i];
                  break;
                }
              }
              if (currentName && existing) {
                appliedInitialSelection = true;
                selectedCandidateIds = {};
                (existing.candidateIds || []).forEach(function (id) { selectedCandidateIds[id] = true; });
                updateOptionSelectionUI();
              }
            }
          },
          function (error) {
            console.error(error);
            setMessage('투표 현황을 불러오지 못했어요.', true);
          },
        );
      }

      function renderCourse(course) {
        const content = document.getElementById('content');
        const placesHtml = (course.places || [])
          .map(function (place, index) {
            return (
              '<div class="place-card">' +
              '<div class="place-order">' + (index + 1) + '</div>' +
              '<div class="place-body">' +
              '<p class="place-name">' + escapeHtml(place.placeName) + '</p>' +
              '<p class="place-address">' + escapeHtml(place.address) + '</p>' +
              (place.category ? '<p class="place-category">' + escapeHtml(place.category) + '</p>' : '') +
              '</div>' +
              '</div>'
            );
          })
          .join('');

        content.innerHTML =
          '<h1>' + escapeHtml(course.title) + '</h1>' +
          (course.description ? '<p class="description">' + escapeHtml(course.description) + '</p>' : '') +
          '<p class="count">장소 ' + (course.places ? course.places.length : 0) + '개</p>' +
          '<div id="places">' + (placesHtml || '<div class="state">담긴 장소가 없어요</div>') + '</div>';
      }

      function renderState(message) {
        document.getElementById('content').innerHTML = '<div class="state">' + escapeHtml(message) + '</div>';
      }

      document.addEventListener('DOMContentLoaded', function () {
        const courseId = new URLSearchParams(window.location.search).get('courseId');
        if (!courseId) {
          renderState('잘못된 링크예요. courseId가 없어요.');
          return;
        }

        // /__/firebase/init.js가 defer로 로드되므로 firebase 전역이 아직 없을 수 있다 —
        // 준비될 때까지 짧게 폴링한다.
        function withFirebase(callback, retriesLeft) {
          if (window.firebase && window.firebase.firestore) {
            callback();
            return;
          }
          if (retriesLeft <= 0) {
            renderState('페이지를 불러오지 못했어요. 잠시 후 다시 시도해주세요.');
            return;
          }
          setTimeout(function () { withFirebase(callback, retriesLeft - 1); }, 100);
        }

        withFirebase(function () {
          firebase
            .firestore()
            .collection('courses')
            .doc(courseId)
            .get()
            .then(function (snapshot) {
              if (!snapshot.exists) {
                renderState('존재하지 않는 코스예요.');
                return;
              }
              var course = snapshot.data();
              renderCourse(course);
              initVoteUi(courseId, course);
            })
            .catch(function (error) {
              console.error(error);
              renderState('코스를 불러오지 못했어요.');
            });
        }, 50);
      });
    </script>
  </body>
</html>
